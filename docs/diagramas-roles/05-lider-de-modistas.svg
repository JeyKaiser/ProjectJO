<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="1087" viewBox="0 0 1250 1087" role="img" aria-labelledby="diagramTitle diagramDesc">
<title id="diagramTitle">Líder de Modistas: Avanzar una orden de taller</title>
<desc id="diagramDesc">Diagrama de secuencia. Precondición: sesión válida y cuenta habilitada.</desc>
<rect width="100%" height="100%" fill="white"/>
<rect x="0" y="0" width="1250" height="88" rx="0" fill="#eef3fb"/>
<text x="38" y="36" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#17243b">05. Líder de Modistas</text>
<text x="38" y="66" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" fill="#4d5c74">Avanzar una orden de taller</text>
<line x1="170" y1="155" x2="170" y2="1006" stroke="#b8c2d3" stroke-width="1" stroke-dasharray="7 5"/>
<rect x="30" y="108" width="280" height="47" rx="8" fill="#17243b"/>
<text x="170" y="138" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" fill="white">Líder de Modistas</text>
<line x1="620" y1="155" x2="620" y2="1006" stroke="#b8c2d3" stroke-width="1" stroke-dasharray="7 5"/>
<rect x="480" y="108" width="280" height="47" rx="8" fill="#17243b"/>
<text x="620" y="138" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" fill="white">Aplicación React</text>
