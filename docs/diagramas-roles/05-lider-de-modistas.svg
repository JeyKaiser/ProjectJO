<text x="395.0" y="530" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#17243b">Iniciar orden pendiente</text>
<text x="31" y="611" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" fill="#63738b">7</text>
<line x1="620" y1="606" x2="1070" y2="606" stroke="#315bad" stroke-width="2"/>
<polygon points="1070,606 1059,601 1059,611" fill="#315bad"/>
<text x="845.0" y="596" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#17243b">updateWorkshopOrder a active</text>
<text x="31" y="677" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" fill="#63738b">8</text>
<line x1="1070" y1="672" x2="620" y2="672" stroke="#32755a" stroke-width="2" stroke-dasharray="7 5"/>
<polygon points="620,672 631,667 631,677" fill="#32755a"/>
<text x="845.0" y="662" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#17243b">Orden iniciada</text>
<text x="31" y="743" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" fill="#63738b">9</text>
<line x1="170" y1="738" x2="620" y2="738" stroke="#315bad" stroke-width="2"/>
<polygon points="620,738 609,733 609,743" fill="#315bad"/>
<text x="395.0" y="728" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#17243b">Avanzar etapa de orden activa</text>
<text x="31" y="809" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" fill="#63738b">10</text>
<line x1="620" y1="804" x2="1070" y2="804" stroke="#315bad" stroke-width="2"/>
<polygon points="1070,804 1059,799 1059,809" fill="#315bad"/>
<text x="845.0" y="794" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#17243b">updateWorkshopOrder con próxima etapa</text>
<text x="31" y="875" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" fill="#63738b">11</text>
<line x1="1070" y1="870" x2="620" y2="870" stroke="#32755a" stroke-width="2" stroke-dasharray="7 5"/>
<polygon points="620,870 631,865 631,875" fill="#32755a"/>
<text x="845.0" y="860" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#17243b">Orden actualizada</text>
<text x="31" y="941" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" fill="#63738b">12</text>
<line x1="620" y1="936" x2="170" y2="936" stroke="#32755a" stroke-width="2" stroke-dasharray="7 5"/>
<polygon points="170,936 181,931 181,941" fill="#32755a"/>
<text x="395.0" y="926" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#17243b">Actualizar tablero e indicadores</text>
<rect x="26" y="1025" width="1198" height="40" rx="7" fill="#f1f5f9"/>
<text x="42" y="1051" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" fill="#4d5c74">Sesión válida y cuenta habilitada · Continua: solicitud · Discontinua: respuesta</text>
