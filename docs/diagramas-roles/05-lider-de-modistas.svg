<polygon points="620,210 609,205 609,215" fill="#315bad"/>
<text x="395.0" y="200" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#17243b">Abrir Control de Taller</text>
<text x="31" y="281" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" fill="#63738b">2</text>
<line x1="620" y1="276" x2="686" y2="276" stroke="#85519a" stroke-width="2"/>
<line x1="686" y1="276" x2="686" y2="293" stroke="#85519a" stroke-width="2"/>
<line x1="686" y1="293" x2="620" y2="293" stroke="#85519a" stroke-width="2"/>
<polygon points="620,293 631,288 631,298" fill="#85519a"/>
<text x="640" y="266" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#17243b">Comprobar acceso al taller</text>
<text x="31" y="347" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" fill="#63738b">3</text>
<line x1="620" y1="342" x2="1070" y2="342" stroke="#315bad" stroke-width="2"/>
<polygon points="1070,342 1059,337 1059,347" fill="#315bad"/>
<text x="845.0" y="332" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#17243b">useWorkshopOrders</text>
<text x="31" y="413" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" fill="#63738b">4</text>
<line x1="1070" y1="408" x2="620" y2="408" stroke="#32755a" stroke-width="2" stroke-dasharray="7 5"/>
<polygon points="620,408 631,403 631,413" fill="#32755a"/>
<text x="845.0" y="398" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#17243b">Órdenes por etapa y estado</text>
<text x="31" y="479" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" fill="#63738b">5</text>
<line x1="620" y1="474" x2="170" y2="474" stroke="#32755a" stroke-width="2" stroke-dasharray="7 5"/>
