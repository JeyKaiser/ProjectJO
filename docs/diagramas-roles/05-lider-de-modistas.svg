<text x="1070" y="138" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" fill="white">Supabase · esquema jo</text>
<text x="31" y="215" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" fill="#63738b">1</text>
