<polygon points="1070,821 1081,816 1081,826" fill="#85519a"/>
<text x="1160" y="774" text-anchor="end" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#17243b">Guardar contramuestras, notas y</text>
<text x="1160" y="794" text-anchor="end" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#17243b">calidad</text>
<text x="31" y="895" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" fill="#63738b">11</text>
<line x1="1070" y1="890" x2="620" y2="890" stroke="#32755a" stroke-width="2" stroke-dasharray="7 5"/>
