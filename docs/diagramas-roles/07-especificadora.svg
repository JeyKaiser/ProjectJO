<text x="31" y="1027" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" fill="#63738b">13</text>
<line x1="1070" y1="1022" x2="620" y2="1022" stroke="#32755a" stroke-width="2" stroke-dasharray="7 5"/>
