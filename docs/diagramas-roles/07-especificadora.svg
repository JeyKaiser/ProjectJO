<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="1239" viewBox="0 0 1250 1239" role="img" aria-labelledby="diagramTitle diagramDesc">
<title id="diagramTitle">Especificadora: Guardar la ficha final</title>
<desc id="diagramDesc">Diagrama de secuencia. Precondición: sesión válida y cuenta habilitada.</desc>
<rect width="100%" height="100%" fill="white"/>
