<line x1="620" y1="1088" x2="170" y2="1088" stroke="#32755a" stroke-width="2" stroke-dasharray="7 5"/>
<polygon points="170,1088 181,1083 181,1093" fill="#32755a"/>
<text x="395.0" y="1078" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#17243b">Mostrar ficha final actualizada</text>
