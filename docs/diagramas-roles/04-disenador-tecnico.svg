<line x1="620" y1="606" x2="170" y2="606" stroke="#32755a" stroke-width="2" stroke-dasharray="7 5"/>
<polygon points="170,606 181,601 181,611" fill="#32755a"/>
<text x="395.0" y="596" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#17243b">Habilitar entrega o devolución</text>
<text x="31" y="677" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" fill="#63738b">8</text>
<line x1="170" y1="672" x2="620" y2="672" stroke="#315bad" stroke-width="2"/>
<polygon points="620,672 609,667 609,677" fill="#315bad"/>
<text x="395.0" y="662" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#17243b">Entregar a Trazador</text>
<text x="31" y="743" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" fill="#63738b">9</text>
<line x1="620" y1="738" x2="1070" y2="738" stroke="#315bad" stroke-width="2"/>
<polygon points="1070,738 1059,733 1059,743" fill="#315bad"/>
<text x="845.0" y="728" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#17243b">RPC deliver_reference_handoff a TRAZADOR</text>
<text x="31" y="809" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" fill="#63738b">10</text>
