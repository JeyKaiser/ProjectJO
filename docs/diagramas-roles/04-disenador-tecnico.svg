<text x="395.0" y="398" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#17243b">Recibir referencia</text>
<text x="31" y="479" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" fill="#63738b">5</text>
<line x1="620" y1="474" x2="1070" y2="474" stroke="#315bad" stroke-width="2"/>
<polygon points="1070,474 1059,469 1059,479" fill="#315bad"/>
<text x="845.0" y="464" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#17243b">updateReferenceHandoff a IN_PROGRESS</text>
<text x="31" y="545" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" fill="#63738b">6</text>
<line x1="1070" y1="540" x2="620" y2="540" stroke="#32755a" stroke-width="2" stroke-dasharray="7 5"/>
