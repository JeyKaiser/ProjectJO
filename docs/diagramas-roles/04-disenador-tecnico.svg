<text x="845.0" y="266" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#17243b">Consultar reference_handoffs</text>
<text x="31" y="347" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" fill="#63738b">3</text>
<line x1="1070" y1="342" x2="620" y2="342" stroke="#32755a" stroke-width="2" stroke-dasharray="7 5"/>
