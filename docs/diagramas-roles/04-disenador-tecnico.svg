<polygon points="1070,821 1081,816 1081,826" fill="#85519a"/>
<text x="1160" y="774" text-anchor="end" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#17243b">TRAZADOR queda</text>
<text x="1160" y="794" text-anchor="end" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#17243b">PENDING_RECEIPT</text>
<text x="31" y="895" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" fill="#63738b">11</text>
<line x1="1070" y1="890" x2="620" y2="890" stroke="#32755a" stroke-width="2" stroke-dasharray="7 5"/>
<polygon points="620,890 631,885 631,895" fill="#32755a"/>
<text x="845.0" y="880" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#17243b">Entrega confirmada</text>
<text x="31" y="961" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" fill="#63738b">12</text>
<line x1="620" y1="956" x2="170" y2="956" stroke="#32755a" stroke-width="2" stroke-dasharray="7 5"/>
<polygon points="170,956 181,951 181,961" fill="#32755a"/>
<text x="395.0" y="946" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#17243b">Actualizar historial de referencia</text>
<rect x="26" y="1045" width="1198" height="40" rx="7" fill="#f1f5f9"/>
<text x="42" y="1071" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" fill="#4d5c74">Sesión válida y cuenta habilitada · Continua: solicitud · Discontinua: respuesta</text>
