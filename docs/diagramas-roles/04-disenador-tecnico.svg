<text x="38" y="36" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#17243b">04. Diseñador Técnico</text>
<text x="38" y="66" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" fill="#4d5c74">Recibir y entregar una referencia</text>
<line x1="170" y1="155" x2="170" y2="1026" stroke="#b8c2d3" stroke-width="1" stroke-dasharray="7 5"/>
<rect x="30" y="108" width="280" height="47" rx="8" fill="#17243b"/>
<text x="170" y="138" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" fill="white">Diseñador Técnico</text>
<line x1="620" y1="155" x2="620" y2="1026" stroke="#b8c2d3" stroke-width="1" stroke-dasharray="7 5"/>
<rect x="480" y="108" width="280" height="47" rx="8" fill="#17243b"/>
<text x="620" y="138" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" fill="white">Aplicación React</text>
<line x1="1070" y1="155" x2="1070" y2="1026" stroke="#b8c2d3" stroke-width="1" stroke-dasharray="7 5"/>
<rect x="930" y="108" width="280" height="47" rx="8" fill="#17243b"/>
<text x="1070" y="138" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" fill="white">Supabase · esquema jo</text>
<text x="31" y="215" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" fill="#63738b">1</text>
