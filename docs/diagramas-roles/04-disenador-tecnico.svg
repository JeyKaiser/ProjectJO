<text x="395.0" y="200" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#17243b">Abrir referencia asignada</text>
<text x="31" y="281" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" fill="#63738b">2</text>
<line x1="620" y1="276" x2="1070" y2="276" stroke="#315bad" stroke-width="2"/>
