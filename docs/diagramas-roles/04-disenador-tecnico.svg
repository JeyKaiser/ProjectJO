<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="1107" viewBox="0 0 1250 1107" role="img" aria-labelledby="diagramTitle diagramDesc">
<title id="diagramTitle">Diseñador Técnico: Recibir y entregar una referencia</title>
<desc id="diagramDesc">Diagrama de secuencia. Precondición: sesión válida y cuenta habilitada.</desc>
<rect width="100%" height="100%" fill="white"/>
